# ---------------------------------------------------------------------------
# Promo Extractor config. To swap models, change ONLY this block.
# ---------------------------------------------------------------------------
llm:
  provider: manual            # manual (paste into a chat model) | rules (no LLM) | openai | anthropic | gemini | openai_compatible
  model: gpt-5-mini           # any model ID your key can use (the notebook prints the list)
  fallback_models: [gpt-4o-mini]   # tried in order if the main model is overloaded or rate-limited
  temperature: 0.2
  max_output_tokens: 4096
  requests_per_minute: 20     # stay under your API tier's limit
  max_retries: 6
  timeout_seconds: 180        # a request that hangs longer than this is retried
  # Key: read from OPENAI_API_KEY (openai / openai_compatible), ANTHROPIC_API_KEY (anthropic)
  # or GEMINI_API_KEY (gemini) unless api_key_env names another variable.
  api_key_env: null
  manual_dir: manual          # manual mode: prompts and pasted answers
  base_url: null              # only for openai_compatible, e.g. https://api.groq.com/openai/v1

# ---------------------------------------------------------------------------
# Promo rules (from the Kuku brief). Python enforces these, not the model.
# ---------------------------------------------------------------------------
promo:
  min_seconds: 20
  max_seconds: 60
  hooks_per_episode: 5        # Hook Hunter asks for 3-5; this is the upper limit
  hook_must_land_within: 3.0  # seconds: the hook must happen in the first 3s of the clip
  snap_tolerance: 1.0         # a model timestamp must be within 1s of a real event, else rejected

# Tier rules (Phase 5 sorter)
tiers:
  tier1_min_hook: 7           # hook_intensity_score >= this
  tier1_min_cliffhanger: 7    # cliffhanger_intensity_score >= this
  splice_max_middle: 4        # middle_story_engagement_score <= this -> Tier 2 (editor splice)
  top_n_for_ranker: 40        # only the best N clips (by score) go to the LLM ranker
  hand_check_sample: 15       # random clips put in hand_check.csv for blind human labelling

rules_file: rules.json      # from rule_maker.py; delete the file to grade on the brief only
cache_dir: .cache             # every model response is saved here; reruns cost nothing
